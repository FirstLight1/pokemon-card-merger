line-length = 100
indent-width = 4

target-version = "py312"

[lint]
select = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "I", # import sorting
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # simplify
]

ignore = [
    "E501", # line length is handled by the formatter
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true
